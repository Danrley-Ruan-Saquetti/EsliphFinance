name: esliph-finance

services:
  workspace:
    image: node:22-bookworm
    container_name: workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-esliph_finance}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
      JWT_SECRET: ${JWT_SECRET:-esliph-finance-development-secret-key}
      ACCESS_TOKEN_EXPIRES_IN_SECONDS: ${ACCESS_TOKEN_EXPIRES_IN_SECONDS:-900}
      REFRESH_TOKEN_EXPIRES_IN_SECONDS: ${REFRESH_TOKEN_EXPIRES_IN_SECONDS:-2592000}
    volumes:
      - ./:/workspace
    command: tail -f /dev/null
    depends_on:
      database:
        condition: service_healthy
    networks:
      - esliph-network

  migrate:
    image: node:22-bookworm
    working_dir: /workspace
    profiles:
      - migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-esliph_finance}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    volumes:
      - ./:/workspace
    command: npm run db:migrate
    depends_on:
      database:
        condition: service_healthy
    networks:
      - esliph-network

  database:
    image: postgres:17-alpine
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-esliph_finance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-esliph_finance}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - esliph-network

volumes:
  npm-cache:
  postgres-data:
networks:
  esliph-network:
